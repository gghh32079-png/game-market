<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GAME MARKET</title>
<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #101827;
  color: white;
  text-align: center;
}
header {
  background: #17243a;
  padding: 25px;
  font-size: 28px;
  font-weight: bold;
  color: #38bdf8;
}
.container {
  padding: 25px;
}
h2 {
  margin-top: 35px;
}
.card {
  background: #1e293b;
  padding: 25px;
  margin: 15px auto;
  border-radius: 15px;
  max-width: 400px;
}
button {
  background: #0ea5e9;
  color: white;
  border: none;
  padding: 13px 25px;
  border-radius: 9px;
  font-size: 17px;
}
</style>
</head>
<body>

<header>🎮 GAME MARKET</header>

<div class="container">
<h2>مرحباً بك في GAME MARKET</h2>
<p>متجرك المميز للألعاب والعروض</p>

<div class="card">
<h3>🎮 الألعاب</h3>
<p>اكتشف أفضل الألعاب</p>
<button>استكشف الآن</button>
</div>

<div class="card">
<h3>🔥 العروض</h3>
<p>عروض وخصومات مميزة</p>
<button>شاهد العروض</button>
</div>

<div class="card">
<h3>🛒 المتجر</h3>
<p>قريباً المزيد من المنتجات</p>
</div>
</div>

</body>
  </html>
