<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GAME MARKET</title>
<style>
*{box-sizing:border-box;scroll-behavior:smooth}
body{margin:0;background:#101114;color:#fff;font-family:Arial,sans-serif;text-align:center}
header{background:#191a20;padding:22px}
.logo{font-size:29px;font-weight:bold;color:#d6ad50}
header p{color:#aaa;font-size:13px;margin:6px 0 0}
nav{display:flex;justify-content:center;gap:18px;padding:14px;background:#1c1e26;flex-wrap:wrap}
nav a{color:#fff;text-decoration:none;font-weight:bold}
.wrap{padding:20px;max-width:520px;margin:auto}
h2{color:#d6ad50;margin:30px 0 14px}
.card{background:#1c1e26;border:1px solid #2e3039;border-radius:16px;padding:18px;margin:14px 0;text-align:right}
.card h3{margin:0 0 6px}
.game{color:#d6ad50;font-weight:bold}
.price{color:#d6ad50;font-size:22px;font-weight:bold;margin:8px 0}
.pics{display:flex;gap:8px;overflow-x:auto;margin-bottom:12px}
.pics img{height:150px;border-radius:10px;flex:none}
button,.wa{display:block;width:100%;border:0;border-radius:10px;padding:13px;font-size:16px;font-weight:bold;cursor:pointer;text-align:center;text-decoration:none;background:#d6ad50;color:#171717}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
.chip{flex:none;width:auto;padding:8px 14px;background:#292b33;color:#fff;font-size:14px}
.chip.on{background:#d6ad50;color:#171717}
label{display:block;text-align:right;margin:14px 0 6px}
input,select{width:100%;padding:13px;border-radius:10px;border:1px solid #3a3d48;background:#292b33;color:#fff;font-size:16px}
small{display:block;color:#aaa;text-align:right;margin-top:6px}
#msg{color:#d6ad50;margin-top:10px}
footer{background:#191a20;padding:22px;margin-top:40px;color:#888}
</style>
</head>
<body>

<header>
  <div class="logo">🎮 GAME MARKET</div>
  <p>سوق حسابات الألعاب</p>
</header>
<nav>
  <a href="#">الرئيسية</a>
  <a href="#list">الحسابات</a>
  <a href="#sell">بيع حسابك</a>
</nav>

<div class="wrap">
  <h2 id="list">🎮 الحسابات المعروضة</h2>
  <div class="chips" id="chips"></div>
  <div id="accounts"><p>جاري التحميل...</p></div>

  <h2 id="sell">➕ أضف حسابك للبيع</h2>
  <div class="card">
    <label>اللعبة</label>
    <select id="game" onchange="updateField()"></select>

    <label id="nameLabel">اسم الحساب</label>
    <input id="name">

    <label id="idLabel">المعرّف</label>
    <input id="accId">
    <small>⚠️ لا تكتب كلمة السر هنا أبداً</small>

    <label>السعر ($)</label>
    <input id="price" type="number" placeholder="مثلاً: 50">

    <label>صور الحساب (حتى 3 صور)</label>
    <input id="imgs" type="file" accept="image/*" multiple>
    <small id="imgInfo">اختياري، بس الصور بتزيد فرصة البيع</small>

    <label>رابط الواتساب تبعك</label>
    <input id="contact" placeholder="https://wa.me/963938948259 أو اكتب رقمك">
    <small>المشتري رح يتواصل معك من هذا الرابط</small>

    <br>
    <button id="pubBtn" onclick="addAccount()">نشر الحساب</button>
    <p id="msg"></p>
  </div>
</div>

<footer>© 2026 GAME MARKET</footer>

<script>
const DEFAULT_WA = "https://wa.me/963938948259";

const BASE = "https://bzylclvczxhehmsnyhju.supabase.co";
const URL_ = BASE + "/rest/v1/products";
const STORE = BASE + "/storage/v1/object/account-images";
const PUBLIC = BASE + "/storage/v1/object/public/account-images";
const KEY = "sb_publishable_5Km0CwnO9ftM5-3LGVDztA_9vDoOt6W";
const H = {apikey: KEY, Authorization: "Bearer " + KEY, "Content-Type": "application/json"};

const games = {
  pubg:     {t:"ببجي",                 n:"اسم اللاعب",     nh:"مثلاً: Omar",          l:"الأيدي (ID)",   h:"مثلاً: 5123456789"},
  clash:    {t:"كلاش أوف كلانس",       n:"اسم القرية",     nh:"مثلاً: قرية ماكس",     l:"المعرّف (Tag)", h:"مثلاً: #2PP0LQ8"},
  royale:   {t:"كلاش رويال",           n:"اسم اللاعب",     nh:"مثلاً: Omar",          l:"المعرّف (Tag)", h:"مثلاً: #2PP0LQ8"},
  brawl:    {t:"براول ستارز",          n:"اسم اللاعب",     nh:"مثلاً: Omar",          l:"المعرّف (Tag)", h:"مثلاً: #2PP0LQ8"},
  freefire: {t:"فري فاير",             n:"اسم اللاعب",     nh:"مثلاً: Omar",          l:"الأيدي (ID)",   h:"مثلاً: 123456789"},
  cod:      {t:"كول أوف ديوتي موبايل", n:"اسم اللاعب",     nh:"مثلاً: Omar",          l:"الأيدي (UID)",  h:"مثلاً: 6812345678"},
  fortnite: {t:"فورتنايت",             n:"اسم الحساب",     nh:"مثلاً: حساب سكنات نادرة", l:"اسم المستخدم", h:"مثلاً: Player123"},
  roblox:   {t:"روبلوكس",              n:"اسم الحساب",     nh:"مثلاً: حساب Robux",    l:"اسم المستخدم",  h:"مثلاً: Player123"},
  minecraft:{t:"ماينكرافت",            n:"اسم الحساب",     nh:"مثلاً: حساب كامل",     l:"اسم المستخدم",  h:"مثلاً: Steve123"},
  fc:       {t:"EA FC / فيفا",         n:"اسم الفريق",     nh:"مثلاً: Dream Team",    l:"الأيدي (ID)",   h:"الأيدي أو اسم الحساب"},
  genshin:  {t:"جينشن إمباكت",         n:"اسم اللاعب",     nh:"مثلاً: Traveler",      l:"الـ UID",       h:"مثلاً: 800123456"},
  other:    {t:"لعبة أخرى",            n:"اسم الحساب",     nh:"اكتب اسم الحساب",      l:"المعرّف",       h:"الأيدي أو اسم المستخدم"}
};

let filter = "all", rows = [];

function esc(s){const d=document.createElement("div");d.textContent=s==null?"":s;return d.innerHTML}

function cleanWA(v){
  v = (v || "").trim();
  if (/^https:\/\/wa\.me\/\d{7,15}(\?.*)?$/.test(v)) return v;
  const digits = v.replace(/[\s+\-]/g, "");
  if (/^\d{7,15}$/.test(digits)) {
    const n = digits.startsWith("0") ? "963" + digits.slice(1) : digits;
    return "https://wa.me/" + n;
  }
  return null;
}

// تصغير الصورة قبل الرفع (أقصى 900 بيكسل)
function resize(file){
  return new Promise((res, rej) => {
    const img = new Image();
    const u = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(1, 900 / Math.max(img.width, img.height));
      const w = Math.round(img.width * s), h = Math.round(img.height * s);
      const c = document.createElement("canvas");
      c.width = w; c.height = h;
      c.getContext("2d").drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(u);
      c.toBlob(b => b ? res(b) : rej(new Error("فشل تجهيز الصورة")), "image/jpeg", 0.8);
    };
    img.onerror = () => rej(new Error("الصورة غير صالحة"));
    img.src = u;
  });
}

async function uploadImage(blob){
  const name = Date.now() + "-" + Math.random().toString(36).slice(2, 8) + ".jpg";
  const r = await fetch(STORE + "/" + name, {
    method: "POST",
    headers: {apikey: KEY, Authorization: "Bearer " + KEY, "Content-Type": "image/jpeg"},
    body: blob
  });
  if (!r.ok) throw new Error("فشل رفع الصورة");
  return PUBLIC + "/" + name;
}

function buildUI(){
  document.getElementById("game").innerHTML =
    Object.keys(games).map(k=>'<option value="'+k+'">'+games[k].t+'</option>').join("");
  updateField();
  drawChips();
  document.getElementById("imgs").addEventListener("change", function(){
    const n = this.files.length;
    document.getElementById("imgInfo").textContent =
      n > 3 ? "رح ناخد أول 3 صور بس" : n ? "تم اختيار " + n + " صورة" : "اختياري، بس الصور بتزيد فرصة البيع";
  });
}

function updateField(){
  const g = games[document.getElementById("game").value];
  document.getElementById("nameLabel").textContent = g.n;
  document.getElementById("name").placeholder = g.nh;
  document.getElementById("idLabel").textContent = g.l;
  document.getElementById("accId").placeholder = g.h;
}

function drawChips(){
  const all = [["all","الكل"]].concat(Object.keys(games).map(k=>[k,games[k].t]));
  document.getElementById("chips").innerHTML = all.map(c =>
    '<button class="chip '+(filter===c[0]?'on':'')+'" onclick="setFilter(\''+c[0]+'\')">'+c[1]+'</button>').join("");
}

function setFilter(f){filter=f;drawChips();draw()}

function draw(){
  const box = document.getElementById("accounts");
  const list = filter==="all" ? rows : rows.filter(a=>a.game===filter);
  if(!list.length){box.innerHTML="<p>ما في حسابات هون بعد.</p>";return}
  box.innerHTML = list.map(a=>{
    const g = games[a.game] || {t:a.game, n:"الاسم", l:"المعرّف"};
    const link = cleanWA(a.contact) || DEFAULT_WA;
    const pics = (a.images || "").split(",").filter(u => u.indexOf(PUBLIC + "/") === 0);
    const picsHtml = pics.length
      ? '<div class="pics">' + pics.map(u => '<a href="'+esc(u)+'" target="_blank" rel="noopener"><img src="'+esc(u)+'" loading="lazy" alt=""></a>').join("") + '</div>'
      : "";
    return '<div class="card">'+picsHtml+'<h3>'+esc(a.name)+'</h3>'+
      '<div class="game">'+esc(g.t)+'</div>'+
      '<p>'+esc(g.l)+': '+esc(a.account_id)+'</p>'+
      '<div class="price">$'+esc(a.price)+'</div>'+
      '<a class="wa" href="'+esc(link)+'" target="_blank" rel="noopener">تواصل مع البائع</a></div>';
  }).join("");
}

async function load(){
  const box = document.getElementById("accounts");
  try{
    const r = await fetch(URL_+"?select=*&order=created_at.desc",{headers:H});
    const data = await r.json();
    if(!r.ok) throw new Error(data.message||"خطأ");
    rows = data; draw();
  }catch(e){box.innerHTML="<p>تعذّر التحميل: "+esc(e.message)+"</p>"}
}

async function addAccount(){
  const msg = document.getElementById("msg");
  const btn = document.getElementById("pubBtn");
  const contact = cleanWA(document.getElementById("contact").value);
  const body = {
    game: document.getElementById("game").value,
    name: document.getElementById("name").value.trim(),
    account_id: document.getElementById("accId").value.trim(),
    price: Number(document.getElementById("price").value),
    contact: contact
  };
  if(!body.name||!body.account_id||!body.price){msg.textContent="عبّي كل الحقول";return}
  if(!contact){msg.textContent="اكتب رابط واتساب صحيح (wa.me) أو رقمك";return}
  btn.disabled = true;
  try{
    const files = Array.from(document.getElementById("imgs").files).slice(0, 3);
    const urls = [];
    for (let i = 0; i < files.length; i++) {
      msg.textContent = "جاري رفع الصورة " + (i + 1) + " من " + files.length + "...";
      urls.push(await uploadImage(await resize(files[i])));
    }
    if (urls.length) body.images = urls.join(",");
    msg.textContent = "جاري النشر...";
    const r = await fetch(URL_,{method:"POST",headers:Object.assign({Prefer:"return=minimal"},H),body:JSON.stringify(body)});
    if(!r.ok){const e=await r.json();throw new Error(e.message||"خطأ")}
    msg.textContent="✅ تم نشر الحساب";
    ["name","accId","price","contact","imgs"].forEach(i=>document.getElementById(i).value="");
    document.getElementById("imgInfo").textContent = "اختياري، بس الصور بتزيد فرصة البيع";
    load();
  }catch(e){msg.textContent="❌ "+e.message}
  btn.disabled = false;
}

buildUI();
load();
</script>
</body>
  </html>
